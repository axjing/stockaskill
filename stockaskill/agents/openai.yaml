display_name: Smart Stock Selector
short_description: Intelligent multi-market stock and ETF analysis with factor scoring, quantitative strategies, bounded sync, portfolio management, and BUY/SELL/HOLD signals for A/HK/US/ETF-first workflows.
default_prompt: Analyze stocks or ETFs and provide intelligent selection recommendations. Screen A-shares, HK stocks, US stocks, or exchange-traded ETFs using multi-factor analysis (value/quality/growth/momentum/low-vol/size), run quantitative strategies (multi-factor/deep-value/GARP/MA-trend/contrarian), use local cache first with bounded sync when needed, and provide BUY/SELL/HOLD signals with risk assessment. Do not assume broad mutual-fund platform coverage or full-universe market-data sync.
